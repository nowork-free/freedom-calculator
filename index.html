<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务自由测算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5;
    --white: #ffffff;
    --text: #333333;
    --text-muted: #888888;
    --text-light: #aaaaaa;
    --border: #e8e8e8;
    --table-bg: #f5f5f5;
    --accent: #2e6b4f;
    --accent-light: #e8f2ed;
    --accent2: #c8883a;
    --accent2-light: #fdf3e8;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    min-height: 100vh;
    padding: 40px 16px 80px;
  }

  .container { max-width: 660px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 36px; }

  .header-tag {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  .header h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  .header p { margin-top: 8px; font-size: 14px; color: var(--text-muted); }

  .card {
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 28px 24px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    display: block;
    width: 3px;
    height: 14px;
    background: var(--accent);
    border-radius: 2px;
  }

  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  .input-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 480px) {
    .input-grid { grid-template-columns: 1fr; gap: 12px; }
    .input-grid-3 { grid-template-columns: 1fr; gap: 12px; }
  }

  .input-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .input-hint {
    font-size: 11px;
    color: var(--text-light);
    font-weight: 400;
    margin-left: 4px;
  }

  .input-wrapper { position: relative; }

  .input-prefix, .input-suffix {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .input-prefix { left: 12px; }
  .input-suffix { right: 12px; }

  .input-wrapper input {
    width: 100%;
    background: var(--table-bg);
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 11px 12px 11px 28px;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    -webkit-appearance: none;
  }

  .input-wrapper.has-suffix input { padding: 11px 28px 11px 12px; }
  .input-wrapper.no-prefix input { padding: 11px 12px; }

  .input-wrapper input:focus {
    border-color: var(--accent);
    background: var(--white);
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  @media (max-width: 480px) {
    .result-grid { grid-template-columns: 1fr 1fr; }
  }

  .result-card {
    background: var(--white);
    border-radius: 14px;
    padding: 18px 16px;
    box-shadow: var(--shadow);
  }

  .result-card.highlight { background: var(--accent); }
  .result-card.highlight2 { background: var(--accent2-light); border: 1.5px solid #f0d4a8; }

  .result-card-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .result-card.highlight .result-card-label { color: rgba(255,255,255,0.7); }

  .result-card-value {
    font-size: clamp(16px, 3.5vw, 22px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }

  .result-card.highlight .result-card-value { color: #ffffff; }
  .result-card.highlight2 .result-card-value { color: var(--accent2); }

  .table-card {
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .table-card-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .table-card-header::before {
    content: '';
    display: block;
    width: 3px;
    height: 14px;
    background: var(--accent);
    border-radius: 2px;
    flex-shrink: 0;
  }

  .table-card-header h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .table-wrapper { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    padding: 10px 16px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    letter-spacing: 0.5px;
    text-align: right;
    background: var(--table-bg);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.12s;
  }

  tbody tr:hover { background: #fafafa; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr.milestone td:first-child { font-weight: 600; }

  tbody tr.freedom-row { background: var(--accent-light) !important; }
  tbody tr.freedom-row td { color: var(--accent) !important; font-weight: 600; }

  td {
    padding: 10px 16px;
    font-size: 13px;
    text-align: right;
    color: var(--text-muted);
    white-space: nowrap;
  }

  td:first-child { text-align: left; color: var(--text); font-size: 14px; }

  .freedom-badge {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .freedom-year {
    display: block;
    font-size: 11px;
    color: var(--accent);
    opacity: 0.7;
    margin-top: 2px;
    font-weight: 400;
  }

  td.green { color: var(--accent); font-weight: 500; }
  td.gold { color: var(--accent2); }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-tag">上班为了不上班</div>
    <h1>你的财务自由还有多远？</h1>
    <p>填入数字，算出属于你的答案</p>
  </div>

  <div class="card">
    <div class="card-title">输入你的数据</div>

    <div class="input-grid">
      <div class="input-group">
        <label>初始资金 <span class="input-hint">可填0</span></label>
        <div class="input-wrapper">
          <span class="input-prefix">¥</span>
          <input type="number" id="initial" value="0" min="0" oninput="calculate()">
        </div>
      </div>
      <div class="input-group">
        <label>月定投额</label>
        <div class="input-wrapper">
          <span class="input-prefix">¥</span>
          <input type="number" id="monthly" value="1500" min="0" oninput="calculate()">
        </div>
      </div>
    </div>

    <div class="input-grid-3">
      <div class="input-group">
        <label>年化收益率</label>
        <div class="input-wrapper has-suffix">
          <input type="number" id="rate" value="12" min="0" max="100" step="0.1" oninput="calculate()">
          <span class="input-suffix">%</span>
        </div>
      </div>
      <div class="input-group">
        <label>月度支出</label>
        <div class="input-wrapper">
          <span class="input-prefix">¥</span>
          <input type="number" id="expense" value="5000" min="0" oninput="calculate()">
        </div>
      </div>
      <div class="input-group">
        <label>财务自由目标</label>
        <div class="result-display" id="res-target" style="
          background: var(--table-bg);
          border-radius: 10px;
          padding: 11px 12px;
          font-size: 16px;
          font-weight: 600;
          color: var(--accent);
          height: 46px;
          display: flex;
          align-items: center;
        ">¥150万</div>
      </div>
    </div>
  </div>

  <div class="result-grid">
    <div class="result-card">
      <div class="result-card-label">初始资金</div>
      <div class="result-card-value" id="res-initial">¥0</div>
    </div>
    <div class="result-card highlight">
      <div class="result-card-label">所需时间</div>
      <div class="result-card-value" id="res-time">20年1个月</div>
    </div>
    <div class="result-card highlight2">
      <div class="result-card-label">预计达成年份</div>
      <div class="result-card-value" id="res-year">2046年</div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-card-header">
      <h2>复利推演 · 逐年追踪</h2>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>投资时长</th>
            <th>累计投入</th>
            <th>资产规模</th>
            <th>投资收益</th>
            <th>总收益率</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    基于4%安全提取法则 · 月复利计算 · 仅供参考，不构成投资建议
  </div>

</div>

<script>
  const currentYear = new Date().getFullYear();

  function fmtMoney(n) {
    n = Math.round(n);
    if (n >= 100000000) return '¥' + (n / 100000000).toFixed(2) + '亿';
    if (n >= 10000) return '¥' + (n / 10000).toFixed(0) + '万';
    return '¥' + n.toLocaleString('zh-CN');
  }

  function fmtFull(n) {
    return '¥' + Math.round(n).toLocaleString('zh-CN');
  }

  function calculate() {
    const initial = parseFloat(document.getElementById('initial').value) || 0;
    const monthly = parseFloat(document.getElementById('monthly').value) || 0;
    const annualRate = parseFloat(document.getElementById('rate').value) || 0;
    const expense = parseFloat(document.getElementById('expense').value) || 0;

    const monthlyRate = annualRate / 100 / 12;
    const target = expense * 12 / 0.04;

    document.getElementById('res-target').textContent = fmtMoney(target);
    document.getElementById('res-initial').textContent = fmtMoney(initial);

    // 用逐月模拟找到达标时间（支持初始资金）
    let totalMonths = 0;
    if (target > 0 && (monthly > 0 || initial > 0)) {
      // 先检查初始资金是否已达标
      if (initial >= target) {
        totalMonths = 0;
      } else {
        let fv = initial;
        totalMonths = 0;
        const maxMonths = 40 * 12;
        while (fv < target && totalMonths < maxMonths) {
          fv = fv * (1 + monthlyRate) + monthly;
          totalMonths++;
        }
        if (fv < target) totalMonths = maxMonths;
      }
    }

    const years = Math.floor(totalMonths / 12);
    const remainMonths = totalMonths % 12;

    let timeStr = '';
    if (totalMonths === 0) {
      timeStr = '已达成';
    } else if (years > 0 && remainMonths > 0) {
      timeStr = `${years}年${remainMonths}个月`;
    } else if (years > 0) {
      timeStr = `${years}年`;
    } else {
      timeStr = `${remainMonths}个月`;
    }

    document.getElementById('res-time').textContent = timeStr;
    const achieveYear = currentYear + years + (remainMonths > 0 ? 1 : 0);
    document.getElementById('res-year').textContent = totalMonths === 0 ? `${currentYear}年` : `${achieveYear}年`;

    const freedomYear = years + (remainMonths > 0 ? 1 : 0);
    const milestones = new Set([5, 10, 15, 20, 25, 30, 35, 40]);

    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    for (let y = 1; y <= 40; y++) {
      // 初始资金复利 + 定投复利
      const initialFV = monthlyRate === 0
        ? initial
        : initial * Math.pow(1 + monthlyRate, 12 * y);

      const dcaFV = monthlyRate === 0
        ? monthly * 12 * y
        : monthly * ((Math.pow(1 + monthlyRate, 12 * y) - 1) / monthlyRate) * (1 + monthlyRate);

      const fv = initialFV + dcaFV;
      const totalInvested = initial + monthly * 12 * y;
      const profit = fv - totalInvested;
      const returnRate = totalInvested > 0 ? Math.round((profit / totalInvested) * 100) : 0;

      const isFreedom = (y === freedomYear);
      const isMilestone = milestones.has(y);

      const tr = document.createElement('tr');
      if (isFreedom) tr.classList.add('freedom-row');
      else if (isMilestone) tr.classList.add('milestone');

      tr.innerHTML = `
        <td>${y} 年${isFreedom ? `<span class="freedom-badge">财务自由</span><span class="freedom-year">${achieveYear}年达成</span>` : ''}</td>
        <td>${fmtFull(totalInvested)}</td>
        <td class="${fv >= target ? 'green' : ''}">${fmtFull(fv)}</td>
        <td class="green">${fmtFull(profit)}</td>
        <td class="gold">${returnRate}%</td>
      `;
      tbody.appendChild(tr);
    }
  }

  calculate();
</script>
</body>
</html>
